name: CLI E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      frontends: ${{ steps.set-matrix.outputs.frontends }}
      backends: ${{ steps.set-matrix.outputs.backends }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set-matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          cat << 'EOF' > generate_matrix.py
          import subprocess
          import json
          import os
          import sys

          def get_all(dir_path):
              return [d for d in os.listdir(dir_path) if os.path.isdir(os.path.join(dir_path, d))]

          all_frontends = get_all('templates/frontend')
          all_backends = get_all('templates/backend')

          event_name = os.environ.get('GITHUB_EVENT_NAME')
          base_ref = os.environ.get('GITHUB_BASE_REF')

          frontends = set()
          backends = set()
          test_all = False

          if event_name == 'pull_request':
              try:
                  subprocess.run(['git', 'fetch', 'origin', base_ref], check=True)
                  diff_output = subprocess.check_output(
                      ['git', 'diff', '--name-only', f'origin/{base_ref}...HEAD'],
                      text=True
                  )
                  changed_files = [line.strip() for line in diff_output.split('\n') if line.strip()]
                  
                  for f in changed_files:
                      if not f.startswith('templates/'):
                          test_all = True
                          break
                      
                      parts = f.split('/')
                      if len(parts) >= 3:
                          if parts[1] == 'frontend':
                              frontends.add(parts[2])
                          elif parts[1] == 'backend':
                              backends.add(parts[2])
              except Exception as e:
                  print(f"Error getting changed files: {e}", file=sys.stderr)
                  test_all = True
          else:
              test_all = True

          if test_all or not frontends:
              frontends = set(all_frontends)
          if test_all or not backends:
              backends = set(all_backends)

          frontends = list(frontends.intersection(all_frontends))
          backends = list(backends.intersection(all_backends))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"frontends={json.dumps(frontends)}\n")
              f.write(f"backends={json.dumps(backends)}\n")
          EOF
          python3 generate_matrix.py

  e2e:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(needs.generate-matrix.outputs.frontends) }}
        backend: ${{ fromJson(needs.generate-matrix.outputs.backends) }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up .NET
      if: matrix.backend == 'dotnet'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install Dependencies
      run: |
        npm install
        npm install -D @playwright/test wait-on

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Scaffold App (${{ matrix.frontend }} + ${{ matrix.backend }})
      run: node cli/index.js test-app --frontend ${{ matrix.frontend }} --backend ${{ matrix.backend }}

    - name: Run lint.sh
      run: cd test-app && ./lint.sh

    - name: Run test.sh
      run: cd test-app && ./test.sh

    - name: Start Servers and Run Integration Test
      env:
        FRONTEND: ${{ matrix.frontend }}
      run: |
        cd test-app
        # Start the backend and frontend in the background
        nohup ./start.sh > start.log 2>&1 &
        
        # Wait for the backend to be healthy
        npx wait-on tcp:8000 -t 60000
        
        # Wait for the frontend to be reachable
        if [ "$FRONTEND" = "nextjs" ]; then
          npx wait-on http-get://localhost:3000 -t 60000
        elif [ "$FRONTEND" = "angular" ]; then
          npx wait-on http-get://localhost:4200 -t 60000
        else
          npx wait-on http-get://localhost:5173 -t 60000
        fi
        
        # Run the Playwright integration test from the root directory
        cd ..
        npx playwright test tests/integration.spec.js --project=chromium

  auto-merge:
    needs: e2e
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/update-frameworks')
    steps:
      - uses: actions/checkout@v4
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --admin
