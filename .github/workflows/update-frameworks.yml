name: Update Framework Versions

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly at midnight on Sunday
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install update tools
        run: |
          npm install -g npm-check-updates
          pip install pur
          dotnet tool install -g dotnet-outdated-tool || true

      - name: Update Root and CLI dependencies
        run: |
          npm ci || npm install
          ncu -u --peer --reject "jasmine-core,@types/jasmine,typescript,eslint"
          npm install --package-lock-only
          
      - name: Update Frontend Templates
        run: |
          for dir in templates/frontend/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Updating frontend template: $dir"
              (
                cd "$dir"
                npm ci || npm install
                ncu -u --peer --reject "jasmine-core,@types/jasmine,typescript,eslint"
                npm install --package-lock-only
              )
            fi
          done

- name: Update Database Dependencies
        run: |
          if [ -f "templates/base/database/requirements.txt" ]; then
            (cd templates/base/database && pur -r requirements.txt)
          fi

      - name: Update Backend Templates
        run: |
          for dir in templates/backend/*; do
            if [ -d "$dir" ]; then
              echo "Updating backend template: $dir"
              if [ -f "$dir/package.json" ]; then
                (
                  cd "$dir"
                  npm ci || npm install
                  ncu -u --peer --reject "typescript,eslint"
                  npm install --package-lock-only
                )
              fi
              if [ -f "$dir/requirements.txt" ]; then
                (cd "$dir" && pur -r requirements.txt)
              fi
              # Check for any .csproj files to update .NET templates
              if ls "$dir"/*.csproj 1> /dev/null 2>&1; then
                (cd "$dir" && dotnet outdated -u)
              fi
            fi
          done

      - name: Update Hardcoded Versions in UI (README & CLI)
        run: |
          cat << 'EOF' > update-ui.js
          const fs = require('fs');
          const path = require('path');
          
          function getVer(file, jsonPath, isDev = false) {
            try {
              const content = fs.readFileSync(file, 'utf8');
              if (file.endsWith('.json')) {
                const json = JSON.parse(content);
                const deps = isDev ? json.devDependencies : json.dependencies;
                return deps[jsonPath].replace(/[\^~]/g, '');
              } else if (file.endsWith('.txt')) {
                const match = content.match(new RegExp(`^${jsonPath}==(.*)$`, 'im'));
                return match ? match[1].trim() : null;
              } else if (file.endsWith('.csproj')) {
                const match = content.match(new RegExp(`Include="${jsonPath}"[^>]*Version="([^"]+)"`));
                return match ? match[1] : null;
              }
            } catch (e) { return null; }
          }
          
          const versions = {
            'Next.js': getVer('templates/frontend/nextjs/package.json', 'next'),
            'Angular': getVer('templates/frontend/angular/package.json', '@angular/core'),
            'Vue': getVer('templates/frontend/vue/package.json', 'vue'),
            'Svelte': getVer('templates/frontend/svelte/package.json', 'svelte', true),
            'FastAPI': getVer('templates/backend/fastapi/requirements.txt', 'fastapi'),
            'Flask': getVer('templates/backend/flask/requirements.txt', 'Flask'),
            '.NET': getVer('templates/backend/dotnet/Tests/Tests.csproj', 'Microsoft.AspNetCore.Mvc.Testing'),
            'Node.js Express': getVer('templates/backend/nodejs/package.json', 'express'),
            'Alembic': getVer('templates/base/database/requirements.txt', 'alembic'),
            'SQLAlchemy': getVer('templates/base/database/requirements.txt', 'SQLAlchemy'),
            'Psycopg2': getVer('templates/base/database/requirements.txt', 'psycopg2-binary')
          };
          
          for (const file of ['README.md', 'cli/index.js']) {
            let content = fs.readFileSync(file, 'utf8');
            for (const [framework, version] of Object.entries(versions)) {
              if (!version) continue;
              // Escape dot in framework for regex
              const safeFramework = framework.replace(/\./g, '\\.');
              // Match "Framework (vX.X.X)" and replace
              const regex = new RegExp(`(${safeFramework}\\s*\\(v)[0-9.]+([^)]*\\))`, 'g');
              content = content.replace(regex, `$1${version}$2`);
            }
            fs.writeFileSync(file, content);
          }
          EOF
          node update-ui.js
          rm update-ui.js

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT (Personal Access Token) is recommended to trigger other workflows (like the E2E tests).
          # If a PAT is not available, GITHUB_TOKEN is used, but it won't trigger PR CI automatically.
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: "feat: update framework versions"
          title: "feat: update framework versions"
          body: |
            Automated PR to update framework versions to their latest releases.
            
            This PR was automatically created by a GitHub Action. Tests are expected to run and, if successful, the PR will be auto-merged.
          branch: "feat/update-frameworks"
          delete-branch: true
