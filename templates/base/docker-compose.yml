services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-appdb}"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  migration:
    build:
      context: ./database
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-appdb}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-appdb}
      PORT: 8000
      ASPNETCORE_URLS: http://0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      - backend
    networks:
      - app-network

  # Pipelock AI Firewall: mediates AI agent network traffic & MCP tools
  pipelock:
    image: ghcr.io/luckypipewrench/pipelock:3.6.0
    restart: unless-stopped
    command: run --config /etc/pipelock/pipelock.yaml
    volumes:
      - ./pipelock.yaml:/etc/pipelock/pipelock.yaml:ro
      - pipelock_receipts:/var/log/pipelock/receipts
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  pipelock_receipts:
