version: '3.8'

services:
  ai-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    working_dir: /workspace
    volumes:
      # Strictly bind-mount project workspace only
      - .:/workspace
      # Mask sensitive developer files from host - empty mount so AI cannot read developer secrets
      - /workspace/.env.secrets:/dev/null:ro
      - /workspace/.env.local:/dev/null:ro
    environment:
      # Route all agent traffic through Pipelock AI firewall
      - HTTP_PROXY=http://pipelock:8888
      - HTTPS_PROXY=http://pipelock:8888
      - ALL_PROXY=http://pipelock:8888
      - NO_PROXY=localhost,127.0.0.1,db,backend,frontend
      - DATABASE_URL=postgresql://user:password@db:5432/appdb
      - NODE_ENV=development
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network
    depends_on:
      - pipelock
      - backend
      - db
    stdin_open: true
    tty: true
